# BasicCmd legacy language file (English)
# Legacy line uses & color codes (1.7.10 – 1.18.1 ships the legacy jar)
# Placeholders use braces, e.g. {player} {home} {seconds}

prefix: "&8[&bBasicCmd&8] &r"

general:
  player-only: "&cThis command can only be used by a player."
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer &e{player}&c was not found."
  cooldown: "&cOn cooldown, please wait &e{seconds}&cs."
  reloaded: "&aConfiguration and language files reloaded."
  usage-admin: "&7Usage: &e/basiccmd [reload]"
  version: "&7{version}"
  invalid-page: "&cInvalid page: enter a number between 1 and &e{pages}&c."
  feature-disabled: "&cThis feature is disabled by the server administrator."

home:
  set: "&aHome &e{home}&a has been set."
  set-overwrite: "&aHome &e{home}&a has been updated."
  limit: "&cYou reached the home limit (&e{limit}&c). Delete one with &e/delhome&c first."
  deleted: "&aHome &e{home}&a has been deleted."
  not-found: "&cYou have no home named &e{home}&c."
  invalid-name: "&cInvalid name: only letters, digits, underscore and dash, up to 16 characters."
  teleporting: "&7Teleporting to home &e{home}&7..."
  invalid-world: "&cThe world of home &e{home}&c no longer exists."
  cross-world-denied: "&cHome &e{home}&c is in another world ({world}), cross-world teleport is disabled."
  list-header: "&bYour homes (&e{count}&b/&e{limit}&b, page &e{page}&b/&e{pages}&b):"
  list-empty: "&7You have no homes yet. Use &e/sethome&7 to create one."
  list-item: "&7 - &e{home} &8({world} {x}, {y}, {z})"
  usage-delhome: "&cUsage: &e/delhome <name>"

warp:
  teleporting: "&7Teleporting to warp &e{warp}&7..."
  not-found: "&cWarp &e{warp}&c was not found."
  invalid-world: "&cThe world of warp &e{warp}&c no longer exists."
  created: "&aWarp &e{warp}&a has been created."
  created-overwrite: "&aWarp &e{warp}&a has been updated."
  deleted: "&aWarp &e{warp}&a has been deleted."
  invalid-name: "&cInvalid name: only letters, digits, underscore and dash, up to 16 characters."
  usage: "&7Usage: &e/warp <name>&7 | &e/warps [page]&7 | &e/setwarp <name>&7 | &e/delwarp <name>"
  usage-set: "&cUsage: &e/setwarp <name>"
  usage-del: "&cUsage: &e/delwarp <name>"
  list-header: "&bServer warps (&e{count}&b total, page &e{page}&b/&e{pages}&b):"
  list-empty: "&7No warps yet. An admin can create one with &e/setwarp <name>&7."
  list-item: "&7 - &e{warp} &8({world} {x}, {y}, {z})"

tpa:
  self: "&cYou cannot use this on yourself."
  usage: "&cUsage: &e/tpa <player>"
  usage-tph: "&cUsage: &e/tph <player>"
  sent: "&aTeleport request sent to &e{player}&a."
  sent-tph: "&aRequested &e{player}&a to teleport to you."
  received: "&e{player} &awants to teleport to you. Type &f/tpaccept {player}&a to accept, &f/tpdeny {player}&a to deny."
  received-tph: "&e{player} &awants you to teleport to them. Type &f/tpaccept {player}&a to accept, &f/tpdeny {player}&a to deny."
  accepted: "&aAccepted the request from &e{player}&a."
  accepted-target: "&e{player} &aaccepted your teleport request."
  accepted-tph: "&aAccepted the request from &e{player}&a, you are being moved to them."
  accepted-tph-target: "&e{player} &aaccepted your request and is coming over."
  accepted-tph-pulled: "&aYou were pulled to &e{player}&a."
  denied: "&cDenied the request from &e{player}&c."
  denied-target: "&e{player} &cdenied your request."
  expired: "&cThe request from &e{player}&c has expired."
  none: "&cYou have no pending request from &e{player}&c."
  no-pending: "&cYou have no pending teleport requests."
  cross-world-denied: "&cCross-world teleport with &e{player}&c is not allowed."

teleport:
  countdown: "&7Teleporting in &e{seconds}&7s, do not move."
  cancelled-move: "&cTeleport cancelled: you moved."
  cancelled-damage: "&cTeleport cancelled: you took damage."
  failed: "&cTeleport failed, destination unreachable."

spawn:
  teleporting: "&7Teleporting to the world spawn ({world})..."
  main-world-missing: "&cConfigured main world &e{world}&c does not exist."

back:
  teleporting: "&7Returning to your last position ({world})..."
  none: "&cThere is no position to return to."
  world-gone: "&cThe world of your last position no longer exists."
  death-recorded: "&7Your death location was recorded, use &e/back&7 to return."

rtp:
  searching: "&7Looking for a safe spot..."
  success: "&aTeleported to &e{x}, {y}, {z}&a ({world})."
  failed: "&cCould not find a safe spot, try again later."
  blacklisted: "&cRandom teleport is disabled in this world."
