  list-item: "&7 - &e{home} &8({world} {x}, {y}, {z})"
  usage-delhome: "&c用法：&e/delhome <名字>"

tpa:
  self: "&c不能对自己使用该命令。"
  usage: "&c用法：&e/tpa <玩家>"
  usage-tph: "&c用法：&e/tph <玩家>"
