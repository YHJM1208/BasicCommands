  reloaded: "&a配置与语言文件已重新加载。"
  usage-admin: "&7用法：&e/basiccmd [reload]"
  version: "&7{version}"

home:
  set: "&a已设置家 &e{home}&a。"
  set-overwrite: "&a已更新家 &e{home}&a 的位置。"
  limit: "&c你已达到家的上限（&e{limit}&c 个），请先用 &e/delhome&c 删除一个。"
  deleted: "&a已删除家 &e{home}&a。"
  not-found: "&c你没有名为 &e{home}&c 的家。"
