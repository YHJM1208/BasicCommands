# BasicCmd legacy 语言文件（简体中文）
# legacy 线使用 & 传统色码（1.7.10 – 1.16.4 没有 Adventure / MiniMessage）
# 占位符用大括号，例如 {player} {home} {seconds}

prefix: "&8[&bBasicCmd&8] &r"

general:
  player-only: "&c该命令只能由玩家执行。"
  no-permission: "&c你没有权限执行该命令。"
  player-not-found: "&c找不到玩家 &e{player}&c。"
