  accepted: "&a已接受 &e{player}&a 的请求。"
  accepted-target: "&e{player} &a接受了你的传送请求。"
  accepted-tph: "&a已接受 &e{player}&a 的请求，你正被传送到对方身边。"
  accepted-tph-target: "&e{player} &a接受了你的请求，正在传送过来。"
  accepted-tph-pulled: "&a你已被 &e{player}&a 传送到身边。"
  denied: "&c你拒绝了 &e{player}&c 的请求。"
  denied-target: "&e{player} &c拒绝了你的请求。"
