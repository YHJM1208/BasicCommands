plugins {
    id 'java'
}

group = 'com.example'
version = '1.2.0'

// legacy 线：一份源码同时兼容 1.7.10 – 1.18.1
// 编译基线用 spigot-api 1.8.8（Java 8），只使用 1.7.10 就存在的 API
def mc = (findProperty('mc') ?: '1.8.8').toString()

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:${mc}-R0.1-SNAPSHOT"
}

java {
    toolchain {
        // 编译用 JDK 25（--release 8 输出 Java 8 字节码），避免依赖本机多 JDK 探测
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

processResources {
    filteringCharset = 'UTF-8'
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('plugin.yml') {
        expand(props)
    }
}

jar {
    // 命名：插件名-<MC版本>-<平台>-<插件版本>
    archiveFileName = "BasicCommands-${project.version}-bukkit-1.7.10-1.18.1.jar"
}
