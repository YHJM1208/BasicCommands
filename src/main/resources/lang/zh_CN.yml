# BasicCmd 语言文件（简体中文）
# 所有文本使用 MiniMessage 格式，颜色、加粗、点击按钮都在这里改，不需要改代码。
# 常用标签：<red> <green> <yellow> <aqua> <gray> <gold> <bold> <italic> <underlined>
# 带透明度：#RRGGBB 例如 <#ff8800>
# 占位符用大括号，例如 {player} {home} {seconds}

prefix: "<gray>[<aqua>BasicCmd</aqua>]</gray> "

general:
  player-only: "<red>该命令只能由玩家执行。</red>"
  no-permission: "<red>你没有权限执行该命令。</red>"
  player-not-found: "<red>找不到玩家 <yellow>{player}</yellow>。</red>"
  cooldown: "<red>命令冷却中，请等待 <yellow>{seconds}</yellow> 秒。</red>"
  reloaded: "<green>配置与语言文件已重新加载。</green>"
  usage-admin: "<gray>用法：<yellow>/basiccmd [reload]</yellow></gray>"
  version: "<gray>{version}</gray>"

home:
  set: "<green>已设置家 <yellow>{home}</yellow>。</green>"
  set-overwrite: "<green>已更新家 <yellow>{home}</yellow> 的位置。</green>"
  limit: "<red>你已达到家的上限（<yellow>{limit}</yellow> 个），请先用 <yellow>/delhome</yellow> 删除一个。</red>"
  deleted: "<green>已删除家 <yellow>{home}</yellow>。</green>"
  not-found: "<red>你没有名为 <yellow>{home}</yellow> 的家。</red>"
  invalid-name: "<red>名字不合法：只能用字母、数字、下划线或短横线，最长 16 个字符。</red>"
  teleporting: "<gray>正在传送到家 <yellow>{home}</yellow>……</gray>"
  invalid-world: "<red>家 <yellow>{home}</yellow> 所在的世界已不存在。</red>"
  list-header: "<aqua>你的家（<yellow>{count}</yellow>/<yellow>{limit}</yellow>）：</aqua>"
  list-empty: "<gray>你还没有设置任何家，使用 <yellow>/sethome</yellow> 创建一个。</gray>"
  list-item: "<gray> - <yellow>{home}</yellow> <dark_gray>({world} {x}, {y}, {z})</dark_gray></gray>"
  usage-delhome: "<red>用法：<yellow>/delhome &lt;名字&gt;</yellow></red>"
  cross-world-denied: "<red>家 <yellow>{home}</yellow> 位于其他世界（{world}），当前不允许跨世界传送。</red>"

tpa:
  self: "<red>不能对自己使用该命令。</red>"
  usage: "<red>用法：<yellow>/tpa &lt;玩家&gt;</yellow></red>"
  usage-tph: "<red>用法：<yellow>/tph &lt;玩家&gt;</yellow></red>"
  sent: "<green>已向 <yellow>{player}</yellow> 发送传送请求，等待对方处理。</green>"
  sent-tph: "<green>已请求 <yellow>{player}</yellow> 传送到你身边，等待对方处理。</green>"
  received: "<yellow>{player}</yellow> <green>请求传送到你身边。</green> <click:run_command:'/tpaccept {player}'><hover:show_text:'点击接受'><aqua>[接受]</aqua></hover></click> <click:run_command:'/tpdeny {player}'><hover:show_text:'点击拒绝'><red>[拒绝]</red></hover></click>"
  received-tph: "<yellow>{player}</yellow> <green>请求你传送到他身边。</green> <click:run_command:'/tpaccept {player}'><hover:show_text:'点击接受'><aqua>[接受]</aqua></hover></click> <click:run_command:'/tpdeny {player}'><hover:show_text:'点击拒绝'><red>[拒绝]</red></hover></click>"
  accepted: "<green>已接受 <yellow>{player}</yellow> 的请求。</green>"
  accepted-target: "<green><yellow>{player}</yellow> 接受了你的传送请求。</green>"
  accepted-tph: "<green>已接受 <yellow>{player}</yellow> 的请求，你正被传送到对方身边。</green>"
  accepted-tph-target: "<green><yellow>{player}</yellow> 接受了你的请求，正在传送过来。</green>"
  accepted-tph-pulled: "<green>你已被 <yellow>{player}</yellow> 传送到身边。</green>"
  denied: "<red>你拒绝了 <yellow>{player}</yellow> 的请求。</red>"
  denied-target: "<red><yellow>{player}</yellow> 拒绝了你的请求。</red>"
  expired: "<red>来自 <yellow>{player}</yellow> 的请求已过期。</red>"
  none: "<red>你当前没有来自 <yellow>{player}</yellow> 的待处理请求。</red>"
  no-pending: "<red>你当前没有待处理的传送请求。</red>"
  cross-world-denied: "<red>不能与 <yellow>{player}</yellow> 跨世界传送。</red>"

teleport:
  countdown: "<gray>传送将在 <yellow>{seconds}</yellow> 秒后开始，请勿移动。</gray>"
  cancelled-move: "<red>传送已取消：你移动了位置。</red>"
  cancelled-damage: "<red>传送已取消：你受到了伤害。</red>"
  failed: "<red>传送失败，目标位置不可达。</red>"

rtp:
  searching: "<gray>正在寻找安全落点……</gray>"
  success: "<green>已随机传送到 <yellow>{x}, {y}, {z}</yellow>（{world}）。</green>"
  failed: "<red>附近找不到安全落点，请稍后再试。</red>"
  blacklisted: "<red>当前世界不允许随机传送。</red>"

spawn:
  teleporting: "<gray>正在传送到世界出生点（{world}）……</gray>"
  main-world-missing: "<red>配置的主世界 <yellow>{world}</yellow> 不存在。</red>"

back:
  teleporting: "<gray>正在返回上一个位置（{world}）……</gray>"
  none: "<red>没有可返回的位置。</red>"
  world-gone: "<red>返回点所在的世界已不存在。</red>"
  death-recorded: "<gray>已记录你的死亡位置，可使用 <yellow>/back</yellow> 返回。</gray>"
