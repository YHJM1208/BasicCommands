plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'

// 目标服务端版本：./gradlew jar -Pmc=1.21.11（默认 26.3）
def mc = (findProperty('mc') ?: '26.3').toString()

// 每个 MC 大版本线取「该线最低的 paper-api + 该线最低的 Java」，
// 这样一个包就能覆盖整条线（低版本字节码在高版本 Java 上向前兼容）。
def targets = [
        '1.18.2' : [api: '1.18.2-R0.1-SNAPSHOT', java: 17, toolchain: 21, apiVersion: '1.18', range: '1.18.2'],
        '1.19'   : [api: '1.19-R0.1-SNAPSHOT', java: 17, toolchain: 21, apiVersion: '1.19', range: '1.19-1.19.4'],
        '1.20'   : [api: '1.20-R0.1-SNAPSHOT', java: 17, toolchain: 21, apiVersion: '1.20', range: '1.20-1.20.6'],
        '1.21'   : [api: '1.21-R0.1-SNAPSHOT', java: 21, toolchain: 21, apiVersion: '1.21', range: '1.21-1.21.11'],
        '26.3'   : [api: '26.3.build.249-stable', java: 25, toolchain: 25, apiVersion: '26.3', range: '26.3'],
]

def target = targets[mc]
if (target == null) {
    throw new GradleException("不支持的 mc 版本: ${mc}，可选: ${targets.keySet().join(', ')}")
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${target.api}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(target.toolchain)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}

processResources {
    filteringCharset = 'UTF-8'
    // 必须把 expand 的变量声明为输入，否则切换 -Pmc 时任务会被判定为 UP-TO-DATE，
    // 导致所有版本共用第一次展开出来的 api-version
    def props = [version: project.version, apiVersion: target.apiVersion]
    inputs.properties(props)
    filesMatching('plugin.yml') {
        expand(props)
    }
}

jar {
    // 命名：插件名-<MC版本>-<平台>-<插件版本>
    archiveFileName = "BasicCommands-${target.range}-paper-${project.version}.jar"
}
